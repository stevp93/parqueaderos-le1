<!DOCTYPE html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; connect-src 'self' https://nzvlixwppiyyhpuuihjz.supabase.co wss://nzvlixwppiyyhpuuihjz.supabase.co https://cdn.jsdelivr.net; img-src 'self' data: blob: https://nzvlixwppiyyhpuuihjz.supabase.co; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; media-src 'self' blob:; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16181A">

<title>Pago de parqueadero · La Esperanza 1</title>
<link rel="icon" href="icono.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilos.css">
<style>
  body { display: flex; min-height: 100%; align-items: center; justify-content: center; padding: 18px; }
  .pago { width: 100%; max-width: 440px; }
  .pago .panel { padding: 24px; }
  .pago .encabezado { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px 12px; flex-wrap: wrap; margin-bottom: 22px; }
  .pago .encabezado > div { flex: 1 1 210px; min-width: 0; }
  .pago .acciones { display: grid; gap: 10px; margin-top: 18px; }
  .pago footer { margin-top: 16px; display: flex; align-items: center; justify-content: center; gap: 10px; font-family: var(--mono); font-size: 11px; letter-spacing: .12em; color: var(--mudo); text-transform: uppercase; }
  .pago footer img { height: 22px; width: auto; display: block; opacity: .9; }
  .pago .recibo-numero { font-size: 22px; font-weight: 600; letter-spacing: .06em; margin: -8px 0 18px; color: var(--lima); }
  .pago .huella { word-break: break-all; font-size: 11px; }
  @media print {
    body { background: #fff; color: #111; padding: 0; }
    .pago .panel { border: 1px solid #999; background: #fff; }
    .pago .etiqueta, .pago .ayuda, .pago dt, .pago footer { color: #444; }
    .pago .recibo-numero, .pago .monto, .pago dd { color: #111; }
    .pago .chip { color: #111; border-color: #999; background: #fff; }
    .pago footer img { filter: invert(1); }
    .no-imprimir { display: none !important; }
  }
</style>
</head>
<body>
<main class="pago" id="pago" aria-live="polite">
  <div class="panel"><div class="vacio-lista"><span class="cargando"></span></div></div>
</main>
<script type="module" src="pagar.js"></script>
</body>
</html>
